<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roo Radar Control</title>
  <style>
    :root { --bg:#0b0f14; --panel:#131a22; --line:#253140; --text:#e8edf3; --muted:#93a1b0; --amber:#f5a524; --red:#e5484d; --green:#30a46c; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:16px; }
    h1 { font-size:22px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 14px; font-size:14px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
    input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:18px; width:140px; letter-spacing:2px; }
    button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:16px; cursor:pointer; }
    .big { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:14px 0; }
    .big button { padding:20px 12px; font-weight:700; text-align:left; }
    .big button kbd { float:right; color:var(--muted); font-weight:600; }
    .big button small { display:block; font-weight:500; color:var(--muted); margin-top:4px; font-size:13px; }
    #bF { border-color:var(--red); } #bM { border-color:var(--amber); }
    #state { font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    #state.ok { color:#bff0d3; border-color:#1f6b46; }
    #feed { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; height:260px; overflow:auto; font:13px ui-monospace,monospace; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Roo Radar: researcher control</h1>
  <p>Enter the remote code shown on the phone's setup screen. Keep this page open on your laptop during sessions. The keyboard shortcuts work while this page is focused.</p>
  <div class="row">
    <input id="code" placeholder="code" maxlength="8" autocomplete="off">
    <button id="connect">Connect</button>
    <span id="state">not connected</span>
    <button id="ping">Ping phone</button>
  </div>
  <div class="big">
    <button id="bF">False alarm <kbd>F</kbd><small>Red "kangaroo ahead" alert now (condition B only)</small></button>
    <button id="bM">Mute next roo <kbd>M</kbd><small>The next detection is logged but not shown</small></button>
    <button id="bK">Force roo alert <kbd>K</kbd><small>Use if the model misses a kangaroo it should see</small></button>
    <button id="bN">Next beacon <kbd>N</kbd><small>Use if a beacon was not read</small></button>
    <button id="bEnd">End drive <kbd>E</kbd><small>Stops logging and shows the download screen</small></button>
  </div>
  <div id="feed"></div>
</main>
<script>
  const BASE = 'https://ntfy.sh';
  let topic = null, es = null;
  const $ = id => document.getElementById(id);
  const feed = t => { const f = $('feed'); f.textContent = `${new Date().toLocaleTimeString()}  ${t}\n` + f.textContent; };
  try { $('code').value = localStorage.getItem('rr_code') || ''; } catch (e) {}
  function connect() {
    const code = $('code').value.trim(); if (!code) return;
    try { localStorage.setItem('rr_code', code); } catch (e) {}
    topic = `roo-radar-${code}`;
    if (es) es.close();
    es = new EventSource(`${BASE}/${topic}-status/sse`);
    es.onopen = () => { $('state').textContent = 'connected'; $('state').className = 'ok'; feed('listening for phone status'); };
    es.onerror = () => { $('state').textContent = 'reconnecting'; $('state').className = ''; };
    es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event === 'message') feed('PHONE: ' + m.message); } catch (e) {} };
  }
  async function send(cmd) {
    if (!topic) { feed('connect first'); return; }
    try { await fetch(`${BASE}/${topic}`, { method: 'POST', body: cmd }); feed('sent ' + cmd); }
    catch (e) { feed('send failed: ' + e.message); }
  }
  $('connect').onclick = connect;
  $('ping').onclick = () => send('PING');
  $('bF').onclick = () => send('F'); $('bM').onclick = () => send('M'); $('bK').onclick = () => send('K');
  $('bN').onclick = () => send('N'); $('bEnd').onclick = () => send('END');
  document.addEventListener('keydown', e => {
    if (document.activeElement === $('code')) return;
    const k = e.key.toLowerCase();
    if (k === 'f') send('F'); if (k === 'm') send('M'); if (k === 'k') send('K'); if (k === 'n') send('N'); if (k === 'e') send('END');
  });
  if ($('code').value) connect();
</script>
</body>
</html>
